name: wheels

on:
  workflow_dispatch:
    inputs:
      only:
        description: CIBW_BUILD pattern, empty for all
        default: ""
      os:
        description: JSON list of runners, empty for all
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-15", "macos-15-intel", "windows-latest", "windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os != 'Linux'
        shell: bash
        run: ffmpeg -version | head -n 1
      - if: inputs.only != ''
        shell: bash
        run: echo "CIBW_BUILD=$ONLY" >> "$GITHUB_ENV"
        env:
          ONLY: ${{ inputs.only }}
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
