name: wheels

on:
  workflow_dispatch:
  push:
    branches: [ci]
    tags: ["v*"]

jobs:
  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: pypa/cibuildwheel@v4.3
        env:
          CIBW_BUILD: cp313-*
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
