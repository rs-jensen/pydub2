name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 26.04 ships a lame 3.101 beta, the mp3 tests compare with ffmpeg's lame 3.100
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: echo "IMAGE=${ImageVersion:-none}" >> "$GITHUB_ENV"
      # Keep the downloaded ffmpeg packages, even from a failed run, so a slow mirror only hurts until one download gets through
      - id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-debs
          key: ffmpeg-debs-${{ env.IMAGE }}-${{ github.run_id }}
          restore-keys: ffmpeg-debs-${{ env.IMAGE }}-
      - id: before
        run: |
          mkdir -p ~/apt-debs
          echo "n=$(ls ~/apt-debs | grep -c '\.deb$')" >> "$GITHUB_OUTPUT"
      - timeout-minutes: 26
        run: |
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo cp --update=none ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2 3; do
            timeout 120 $apt update && timeout 360 $apt install -y --no-install-recommends --download-only ffmpeg && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          # Only the download has a time limit, stopping dpkg halfway leaves it broken
          $apt install -y --no-install-recommends ffmpeg
      - id: after
        if: always()
        run: |
          cp --update=none /var/cache/apt/archives/*.deb ~/apt-debs/ || true
          [ "$(ls ~/apt-debs | grep -c '\.deb$')" -gt "${{ steps.before.outputs.n }}" ] && echo "grew=true" >> "$GITHUB_OUTPUT"
          true
      - if: always() && steps.after.outputs.grew == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-debs
          key: ffmpeg-debs-${{ env.IMAGE }}-${{ github.run_id }}
      - run: pip install . ./mp3 pytest pydub audioop-lts numpy scipy
      - run: pytest tests

  test-native:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          for i in 1 2 3; do command -v ffmpeg && break; choco install ffmpeg -y --no-progress; done
          ffmpeg -version | head -n 1
      - if: runner.os == 'macOS'
        run: |
          for i in 1 2 3; do brew install ffmpeg && break; [ "$i" = 3 ] && exit 1; sleep 10; done
      - run: pip install . ./mp3 pytest pydub audioop-lts numpy scipy
      - run: pytest -rs tests
