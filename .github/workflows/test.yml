name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 26.04 ships a lame 3.101 beta, the mp3 tests compare with ffmpeg's lame 3.100
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: echo "IMAGE=${ImageVersion:-none}" >> "$GITHUB_ENV"
      # Keep the downloaded ffmpeg packages so a slow mirror only hurts the first run per runner image
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-debs
          key: ffmpeg-debs-${{ env.IMAGE }}
      - timeout-minutes: 20
        run: |
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          mkdir -p ~/apt-debs
          sudo cp --update=none ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2 3; do
            timeout 300 $apt update && timeout 600 $apt install -y --no-install-recommends ffmpeg && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          cp --update=none /var/cache/apt/archives/*.deb ~/apt-debs/ || true
      - run: pip install . ./mp3 pytest pydub audioop-lts numpy scipy
      - run: pytest tests

  test-native:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          for i in 1 2 3; do command -v ffmpeg && break; choco install ffmpeg -y --no-progress; done
          ffmpeg -version | head -n 1
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pip install . ./mp3 pytest pydub audioop-lts numpy scipy
      - run: pytest -rs tests
